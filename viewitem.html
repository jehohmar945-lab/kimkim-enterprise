<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Item</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #050505; color: #ffffff; padding-bottom: 90px; min-height: 100vh; position: relative; }
        
        /* Top Navigation Header */
        .top-nav {
            padding: 16px;
            background-color: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(212, 175, 90, 0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f1d385;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        .nav-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: #f6e2a4;
        }

        /* Item Container */
        .detail-card {
            max-width: 500px;
            margin: 20px auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .img-wrapper {
            width: 100%;
            max-height: 380px;
            border-radius: 16px;
            overflow: hidden;
            background-color: #121212;
            border: 1px solid rgba(212, 175, 90, 0.2);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            max-height: 380px;
            object-fit: cover;
            display: block;
        }

        .category-tag {
            font-size: 12px;
            text-transform: uppercase;
            color: #d4af5a;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* Enlarged Item Name */
        .item-title {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.2;
            margin-top: 4px;
        }

        /* Large Red Price */
        .item-price-tag {
            font-size: 26px;
            font-weight: 900;
            color: #ff3b30;
            margin-top: 6px;
        }

        /* Admin Control Panel */
        .admin-panel {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            text-align: center;
        }

        .btn-edit-action {
            background: rgba(212, 175, 90, 0.2);
            color: #f1d385;
            border: 1px solid rgba(212, 175, 90, 0.4);
        }

        .btn-delete-action {
            background: rgba(255, 59, 48, 0.15);
            color: #ff3b30;
            border: 1px solid rgba(255, 59, 48, 0.3);
        }

        /* Related Items Section */
        .related-section {
            max-width: 500px;
            margin: 30px auto 10px auto;
            padding: 0 16px;
        }

        .related-title {
            font-size: 18px;
            font-weight: 800;
            color: #f6e2a4;
            margin-bottom: 14px;
            border-bottom: 1px solid rgba(212, 175, 90, 0.2);
            padding-bottom: 8px;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .related-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 8px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .related-img-box {
            width: 100%;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
            background: #121212;
        }

        .related-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .related-name {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .related-price {
            font-size: 15px;
            font-weight: 900;
            color: #ff3b30;
        }

        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: #aaaaaa;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <header class="top-nav">
        <a href="homepage.html" class="btn-back">← Back</a>
        <span class="nav-title">Item Details</span>
    </header>

    <main id="itemDetailsContainer">
        <p class="loading-state">Loading item details...</p>
    </main>

    <!-- Related Items Container -->
    <section class="related-section" id="relatedSection" style="display: none;">
        <h2 class="related-title">Related Items</h2>
        <div class="related-grid" id="relatedGrid"></div>
    </section>

    <script>
        const ADMIN_PASSWORD = "1234";

        const firebaseConfig = {
            apiKey: "AIzaSyCizYkL6CvN5DggN1N4Wy-p_q55a6UEDhs",
            authDomain: "kimkim-enterprise-c10d6.firebaseapp.com",
            projectId: "kimkim-enterprise-c10d6",
            storageBucket: "kimkim-enterprise-c10d6.firebasestorage.app",
            messagingSenderId: "107286919434",
            appId: "1:107286919434:web:d3f50a834c5bdc8c41a2f3"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const itemId = urlParams.get('id');

        const container = document.getElementById('itemDetailsContainer');

        function cleanText(txt) {
            return (txt || '').toLowerCase().trim();
        }

        function checkPassword(actionCallback) {
            const pass = prompt("Enter Admin Password:");
            if (pass === ADMIN_PASSWORD) {
                actionCallback();
            } else if (pass !== null) {
                alert("Incorrect password! Access denied.");
            }
        }

        if (!itemId) {
            container.innerHTML = `<p class="loading-state" style="color:red;">No item ID specified in URL.</p>`;
        } else {
            fetchItemDetails();
        }

        function fetchItemDetails() {
            db.collection("items").doc(itemId).get().then((doc) => {
                if (!doc.exists) {
                    container.innerHTML = `<p class="loading-state">Item not found in database.</p>`;
                    return;
                }

                const data = doc.data();
                const name = data.name || "Unnamed Item";
                const category = data.category || "General";
                const price = data.price ?? 0;
                const imageUrl = data.imageUrl || "https://via.placeholder.com/300";

                container.innerHTML = `
                    <div class="detail-card">
                        <div class="img-wrapper">
                            <img src="${imageUrl}" alt="${name}" onerror="this.src='https://via.placeholder.com/300'">
                        </div>
                        <div>
                            <span class="category-tag">${category}</span>
                            <h1 class="item-title">${name}</h1>
                            <div class="item-price-tag">₹${price}</div>
                        </div>

                        <div class="admin-panel">
                            <button class="btn-action btn-edit-action" onclick="editCurrentItem('${name}', ${price})">Edit Item</button>
                            <button class="btn-action btn-delete-action" onclick="deleteCurrentItem()">Delete Item</button>
                        </div>
                    </div>
                `;

                // Load Related Items
                fetchRelatedItems(itemId, name, category);

            }).catch(err => {
                container.innerHTML = `<p class="loading-state" style="color:red;">Error: ${err.message}</p>`;
            });
        }

        function fetchRelatedItems(currentId, currentName, currentCategory) {
            db.collection("items").get().then((snapshot) => {
                const targetCat = cleanText(currentCategory);
                const targetName = cleanText(currentName);
                const relatedItems = [];

                snapshot.forEach(doc => {
                    // Skip the active item
                    if (doc.id === currentId) return;

                    const data = doc.data();
                    const itemCat = cleanText(data.category);
                    const itemName = cleanText(data.name);

                    // Check for matching category OR overlapping name words
                    const matchesCategory = targetCat !== 'general' && (itemCat.includes(targetCat) || targetCat.includes(itemCat));
                    
                    const targetWords = targetName.split(' ').filter(w => w.length > 2);
                    const matchesName = targetWords.some(word => itemName.includes(word));

                    if (matchesCategory || matchesName) {
                        relatedItems.push({ id: doc.id, ...data });
                    }
                });

                if (relatedItems.length > 0) {
                    const relatedGrid = document.getElementById('relatedGrid');
                    relatedGrid.innerHTML = relatedItems.slice(0, 4).map(item => `
                        <a href="viewitem.html?id=${item.id}" class="related-card">
                            <div class="related-img-box">
                                <img src="${item.imageUrl || 'https://via.placeholder.com/150'}" alt="${item.name}">
                            </div>
                            <h4 class="related-name">${item.name || 'Unnamed Item'}</h4>
                            <div class="related-price">₹${item.price ?? 0}</div>
                        </a>
                    `).join('');
                    
                    document.getElementById('relatedSection').style.display = 'block';
                }
            }).catch(err => console.error("Error fetching related items:", err));
        }

        window.editCurrentItem = function(currentName, currentPrice) {
            checkPassword(() => {
                const newName = prompt("Edit Item Name:", currentName);
                if (newName === null) return;

                const newPrice = prompt("Edit Price (₹):", currentPrice);
                if (newPrice === null) return;

                db.collection("items").doc(itemId).update({
                    name: newName.trim(),
                    price: Number(newPrice)
                }).then(() => {
                    alert("Item updated successfully!");
                    fetchItemDetails();
                }).catch(err => alert("Update failed: " + err.message));
            });
        };

        window.deleteCurrentItem = function() {
            checkPassword(() => {
                if (confirm("Are you sure you want to delete this item permanently?")) {
                    db.collection("items").doc(itemId).delete().then(() => {
                        alert("Item deleted successfully!");
                        window.location.href = "homepage.html";
                    }).catch(err => alert("Delete failed: " + err.message));
                }
            });
        };
    </script>
</body>
</html>
