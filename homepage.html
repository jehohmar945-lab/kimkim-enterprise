<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <style>
        /* Base styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            background-color: #050505;
        }

        body {
            padding-bottom: 90px; /* Space for footer */
            color: #ffffff;
            min-height: 100vh;
            position: relative;
        }

        /* Ambient gold glow backdrop */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 50% 0%, rgba(212, 175, 90, 0.10) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(212, 175, 90, 0.05) 0%, transparent 45%),
                #050505;
        }

        /* 1. Top Search Bar */
        .search-container {
            padding: 18px 16px;
            background-color: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 2px 16px rgba(0,0,0,0.4);
            border-bottom: 1px solid rgba(212, 175, 90, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            padding: 0 2px;
        }

        .brand-mark {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: linear-gradient(135deg, #f1d385, #b8862f);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 0.9rem;
            color: #050505;
            flex-shrink: 0;
        }

        .brand-text {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #f6e2a4, #d4af5a 45%, #b8862f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Search Wrapper for Auto-suggestions */
        .search-wrapper {
            position: relative;
            width: 100%;
        }

        .search-bar {
            width: 100%;
            padding: 13px 20px;
            font-size: 15px;
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            outline: none;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .search-bar::placeholder {
            color: #7a7a7a;
        }

        .search-bar:focus {
            border-color: #d4af5a;
            background-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(212, 175, 90, 0.12);
        }

        /* Auto-suggest dropdown menu */
        .suggestions-box {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 90, 0.25);
            border-radius: 14px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            z-index: 200;
            display: none;
        }

        .suggestion-item {
            padding: 12px 18px;
            font-size: 14px;
            color: #e0e0e0;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background-color: rgba(212, 175, 90, 0.15);
            color: #f6e2a4;
        }

        /* 2. Categories Horizontal Scroll */
        .categories-container {
            padding: 14px 16px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
            background-color: rgba(10, 10, 10, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            scrollbar-width: none;
        }

        .categories-container::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            padding: 8px 18px;
            background-color: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            font-size: 13.5px;
            font-weight: 600;
            color: #d5d5d5;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .category-chip:hover, .category-chip.active {
            background: linear-gradient(135deg, #f1d385, #b8862f);
            border-color: transparent;
            color: #050505;
        }

        /* 3. Items Grid: Strictly 2 cards per row */
        .items-grid {
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        /* Card Link Wrapper */
        .item-card-link {
            text-decoration: none;
            color: inherit;
            display: block;
            width: 100%;
        }

        /* Square Card Layout */
        .item-card {
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .item-card:hover {
            transform: translateY(-3px);
            border-color: rgba(212, 175, 90, 0.4);
            box-shadow: 0 10px 24px rgba(0,0,0,0.4), 0 0 0 1px rgba(212, 175, 90, 0.15);
        }

        .item-category {
            font-size: 10.5px;
            text-transform: uppercase;
            color: #d4af5a;
            font-weight: 700;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
            display: block;
        }

        .item-name {
            font-size: 15px;
            font-weight: 600;
            color: #f2f2f2;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .item-price {
            font-size: 15.5px;
            font-weight: 800;
            background: linear-gradient(135deg, #f6e2a4, #d4af5a 45%, #b8862f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #666666;
            font-size: 14px;
        }

        /* 4. Footer Action Row */
        .footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 72px;
            background-color: rgba(12, 12, 12, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(212, 175, 90, 0.15);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            z-index: 1000;
        }

        .footer-btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            font-size: 13.5px;
            text-align: center;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
        }

        .footer-btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .footer-btn:active {
            transform: scale(0.96);
        }

        .btn-add {
            flex: 2;
            background: linear-gradient(135deg, #f1d385, #b8862f);
            color: #050505;
            box-shadow: 0 6px 18px rgba(212, 175, 90, 0.3);
        }

        .btn-add:hover {
            filter: brightness(1.08);
            box-shadow: 0 8px 22px rgba(212, 175, 90, 0.4);
        }

        .btn-refresh {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.05);
            color: #aaaaaa;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-refresh:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- 1. Search Bar Header -->
    <header class="search-container">
        <div class="brand-row">
            <div class="brand-mark">K</div>
            <span class="brand-text">Kimkim Enterprise</span>
        </div>
        <div class="search-wrapper">
            <input type="text" class="search-bar" id="searchInput" placeholder="Search items..." autocomplete="off">
            <div class="suggestions-box" id="suggestionsBox"></div>
        </div>
    </header>

    <!-- 2. Category List -->
    <section class="categories-container" id="categoryContainer">
        <button class="category-chip active" data-cat="all">All</button>
        <button class="category-chip" data-cat="slipper">#1 slipper</button>
        <button class="category-chip" data-cat="plastic">#2 plastic</button>
        <button class="category-chip" data-cat="thawmhnaw">#3 thawmhnaw</button>
        <button class="category-chip" data-cat="toys">#4 Toys</button>
    </section>

    <!-- 3. Items Grid Container -->
    <main class="items-grid" id="itemsContainer">
        <p class="empty-state">Loading items...</p>
    </main>

    <!-- 4. Footer Buttons -->
    <footer class="footer-nav">
        <a href="add.html" class="footer-btn btn-add" id="addItemBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Item
        </a>

        <button class="footer-btn btn-refresh" onclick="location.reload()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            Refresh
        </button>
    </footer>

    <!-- JavaScript Module -->
    <script type="module" src="load-items.js"></script>
</body>
</html>
